<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaxReady</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="hero">
      <p class="badge">DIY Tax Prep Assistant</p>
      <h1>TaxReady</h1>
      <p>Your beginner-friendly tax prep organizer.</p>
      <button onclick="startChecklist()">
  Start My Tax Checklist
</button>

<section id="quiz" class="quiz hidden">
  <h2>Tax Profile</h2>

  <label>Filing Status</label>
  <select>
    <option>Single</option>
    <option>Married Filing Jointly</option>
    <option>Head of Household</option>
  </select>

  <label>Did you have W-2 income?</label>
  <select>
    <option>Yes</option>
    <option>No</option>
  </select>

  <label>Did you have self-employment income?</label>
  <select>
    <option>Yes</option>
    <option>No</option>
  </select>
</section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
